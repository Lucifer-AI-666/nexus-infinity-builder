version: '3.8'

services:
  nexus-api:
    build: .
    container_name: nexus-infinity-real
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=false
      - DATABASE_URL=postgresql://nexus:nexus@postgres:5432/nexus_db
      - SECURITY_LEVEL=high
      - ENABLE_AUDIT_LOG=true
    volumes:
      - ./nexus_memory:/app/nexus_memory
      - ./nexus_approvals:/app/nexus_approvals
      - ./nexus_logs:/app/nexus_logs
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus
      - POSTGRES_DB=nexus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
