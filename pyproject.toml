[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "nexus-infinity"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "sqlalchemy[asyncio]>=2,<3", "asyncpg>=0.29,<1", "alembic>=1.13,<2"]
[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
include = ["nexus_infinity*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: test che richiede PostgreSQL locale"]
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "nexus_infinity.egg-info"]
